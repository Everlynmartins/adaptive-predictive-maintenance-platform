services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: predictive_maintenance
      POSTGRES_USER: pm_development
      POSTGRES_PASSWORD: pm_development_password
    ports:
      - "5432:5432"
    volumes:
      - predictive_maintenance_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm_development -d predictive_maintenance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pm_development:pm_development_password@db:5432/predictive_maintenance
      PREDICTIVE_MAINTENANCE_PROJECT_ROOT: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uvicorn", "predictive_maintenance.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_BACKEND: api
      PREDICTIVE_MAINTENANCE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "src/predictive_maintenance/ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  simulator:
    profiles: ["simulator"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PREDICTIVE_MAINTENANCE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "predictive_maintenance.simulator.telemetry_producer", "--api-base-url", "http://api:8000", "--unit-id", "1", "--mode", "fast"]

volumes:
  predictive_maintenance_db:
